<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngan V.T. Nguyen resume</title>
    
</head>
<body>
    <header>
        <nav>
            <a href="#about">Giới thiệu</a>
            <a href="#projects">Dự án</a>
            <a href="#contact">Liên hệ</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h1>Nguyễn Vương Thùy Ngân</h1>
            <p>Giảng viên Vật lý, thích làm web.</p>
            <img src="me.webp" alt="Ảnh chân dung Nguyễn Vương Thùy Ngân">
        </section>

        <section id="projects">
            <h2>Dự án</h2>
            <article>
                <h3>Thiết kế web</h3>
                <p>Mô tả và dựng web</p>
            </article>
            <article>
                <h3>Làm app todo</h3>
                <p>Normal todo list</p>
            </article>
            <article>
                <h3>Làm app điểm danh</h3>
                <p>Điểm danh bằng QR code</p>
            </article>
            <!-- Nội dung dự án -->
        </section>

        <section id="contact">
            <h2>Liên hệ</h2>
            <form>
                <label for="name">Tên:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Tin nhắn:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Gửi</button>
            </form>

        </section>
    </main>
    <footer>Bye © 2026 Nguyễn Vương Thùy Ngân</footer>
